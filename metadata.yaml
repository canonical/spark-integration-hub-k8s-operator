name: spark-integration-hub-k8s
display-name: Spark Integration Hub K8s
summary: Kubernetes based charm for the Spark Integration Hub
description: |
  This is the Spark integration hub charm. It provide centralization for other
  charmed components and allows simple configuration of Spark jobs and
  integration with client applications, abstracting low-level configuration
  option settings.
docs: https://canonical-charmed-spark.readthedocs-hosted.com/main/how-to/manage-service-accounts/using-integration-hub
source: https://github.com/canonical/spark-integration-hub-k8s-operator
issues: https://github.com/canonical/spark-integration-hub-k8s-operator/issues
website:
  - https://ubuntu.com/data/spark
  - https://canonical.com/data/docs/spark/k8s
  - https://charmhub.io/spark-integration-hub-k8s
  - https://github.com/canonical/spark-integration-hub-k8s-operator
  - https://matrix.to/#/%23charmhub-analytics%3Aubuntu.com
maintainers:
  - Canonical Data Platform <data-platform@lists.launchpad.net>

assumes:
  - k8s-api
  - juju >= 3.6.13

charm-user: non-root

containers:
  integration-hub:
    resource: integration-hub-image
    uid: 584792
    gid: 584792

resources:
  integration-hub-image:
    type: oci-image
    description: OCI image for the Spark Integration Hub Charm
    # oci-tag=3-22.04_edge
    upstream-source: ghcr.io/canonical/spark-integration-hub:3-22.04_edge@sha256:aa1626db0b42b64b642a021dba4da139ca0023d532e4c85db8748605de0103e9

peers:
  hub-peers:
    interface: hub-peers

requires:
  s3-credentials:
    interface: s3
    optional: true
  azure-storage-credentials:
    interface: azure_storage
    optional: true
  cos:
    interface: pushgateway
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  service-mesh:
    limit: 1
    interface: service_mesh
    description: |
      Integrate this charm into a service mesh
    optional: true
  require-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app relates to other applications on a charmed service mesh cross-model, use this relation to send that related app additional data needed to automatically generate traffic authorization policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.
    optional: true
provides:
  spark-service-account:
    interface: spark_service_account
    optional: true
  provide-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app is generating policies to provide access to related applications that are cross-model, relate that app to this additional relation to retrieve additional data required for these policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.
    optional: true
