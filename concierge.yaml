juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.35-classic/stable
    features:
      local-storage:
    bootstrap-constraints:
      root-disk: 4G

host:
  packages:
    - pipx
    - jq
  snaps:
    microceph:
      channel: squid/stable
    spark-client:
      channel: 3.5/edge
